<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>交叉与嵌套测量记录中的精度分解及复测资源规划</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><h1>交叉与嵌套测量记录中的精度分解及复测资源规划</h1><p>同一样品人员设备组合的重复读数差与量程检查</p></header><main>
<section><h2>当前资料概况</h2><pre id="summary">载入中</pre></section>
<section><h2>业务记录</h2><label>记录集合<select id="source"></select></label><span id="record-count"></span><div id="records"></div></section>
<div class="columns"><section><h2>查看组合内复测散布</h2><form id="action-form"></form><pre id="result">选择记录后操作</pre>
<aside>当前页面保留原始描述与业务记录，具体统计含义见分析约定。</aside></section>
<section><h2>工作批注</h2><form id="note-form"><textarea id="note" required maxlength="2000" aria-label="批注内容"></textarea><button>保存批注</button></form><ul id="notes"></ul></section></div>
</main></body></html>
